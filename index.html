<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nearhand: local freelance marketplace (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --text:#12303A; --muted:#566B72;
  --line:#D8E0DC; --line-strong:#B9C6C1;
  --primary:#0C7867; --primary-hover:#09604f; --primary-text:#FFFFFF;
  --accent:#F0B429; --accent-text:#33250A; --star:#E3A20F;
  --ok:#1B7F47; --bad:#B23E17; --focus:#1B6FE0;
  --c-open:#0C7867; --c-selected:#2760C4; --c-funded:#7447C9; --c-progress:#B26F00; --c-await:#BE4A16; --c-done:#1B7F47;
  --shadow:0 1px 2px rgba(18,48,58,.06),0 8px 24px rgba(18,48,58,.07);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D191E; --surface:#14252B; --surface-2:#1B3038; --text:#E6EEEB; --muted:#9DB1B4;
    --line:#27404A; --line-strong:#3A5560;
    --primary:#3CC7AC; --primary-hover:#5BD8C0; --primary-text:#04211B;
    --accent:#F2BC3F; --accent-text:#2D2105; --star:#F2BC3F;
    --ok:#5BCB8A; --bad:#F29068; --focus:#7FB0FF;
    --c-open:#3CC7AC; --c-selected:#86ABF7; --c-funded:#B79BF3; --c-progress:#F0B04A; --c-await:#F39A6B; --c-done:#5BCB8A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D191E; --surface:#14252B; --surface-2:#1B3038; --text:#E6EEEB; --muted:#9DB1B4;
  --line:#27404A; --line-strong:#3A5560;
  --primary:#3CC7AC; --primary-hover:#5BD8C0; --primary-text:#04211B;
  --accent:#F2BC3F; --accent-text:#2D2105; --star:#F2BC3F;
  --ok:#5BCB8A; --bad:#F29068; --focus:#7FB0FF;
  --c-open:#3CC7AC; --c-selected:#86ABF7; --c-funded:#B79BF3; --c-progress:#F0B04A; --c-await:#F39A6B; --c-done:#5BCB8A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:84px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,4.6vw,3.4rem);font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.125rem;font-weight:700}
p{margin:0 0 1em}
a{color:var(--primary);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--primary-hover)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.container{max-width:1160px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack>*+*{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.page{padding:28px 0 40px}
.page-head{margin-bottom:22px}
.page-head p{max-width:62ch}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site-header .container{display:flex;align-items:center;gap:20px;min-height:64px}
.logo{display:flex;align-items:center;gap:9px;font:800 1.3rem var(--font-display);color:var(--text);text-decoration:none;letter-spacing:-.02em}
.logo:hover{color:var(--text)}
.logo-mark{width:28px;height:28px;border-radius:9px 9px 9px 3px;background:var(--text);display:grid;place-items:center}
.logo-mark i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:block}
.proto-tag{font:600 .7rem var(--font-body);padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.nav{display:flex;gap:4px;align-items:center;flex:1}
.nav a{padding:8px 12px;border-radius:9px;color:var(--text);text-decoration:none;font-weight:500;font-size:.95rem}
.nav a:hover{background:var(--surface-2)}
.nav a.active{background:var(--surface-2);font-weight:700}
.header-right{display:flex;gap:10px;align-items:center}
.me{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--text);font-weight:600;font-size:.9rem;padding:4px 8px 4px 4px;border-radius:999px}
.me:hover{background:var(--surface-2);color:var(--text)}
.burger{display:none}
@media (max-width:900px){
  .burger{display:inline-flex}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;flex-direction:column;align-items:stretch}
  .nav.open{display:flex}
  .site-header .container{justify-content:space-between}
  .header-right .me span{display:none}
}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid transparent;font:600 .9rem/1.2 var(--font-body);cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:var(--primary-text)}
.btn-primary:hover{background:var(--primary-hover);color:var(--primary-text)}
.btn-accent{background:var(--accent);color:var(--accent-text)}
.btn-accent:hover{filter:brightness(1.06);color:var(--accent-text)}
.btn-outline{background:transparent;border-color:var(--line-strong);color:var(--text)}
.btn-outline:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:transparent;border-color:color-mix(in srgb,var(--bad) 55%,var(--line));color:var(--bad)}
.btn-danger:hover{background:color-mix(in srgb,var(--bad) 10%,transparent);color:var(--bad)}
.btn-sm{padding:7px 11px;font-size:.82rem}
.btn-block{display:flex;width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--primary);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.field{margin-bottom:16px}
.field .hint{display:block;font-weight:400;color:var(--muted);font-size:.82rem;margin-top:4px}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font:400 .95rem var(--font-body)}
textarea{resize:vertical;min-height:96px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.form-grid .full{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card.flat{box-shadow:none}
.card.raised{box-shadow:var(--shadow)}
.card h3{margin-bottom:.6em}
.narrow{max-width:520px;margin:0 auto}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;font-weight:500;margin:0;padding:6px 10px;border:1px solid var(--line-strong);border-radius:999px;cursor:pointer;font-size:.85rem}
.checks input{accent-color:var(--primary)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:36px;align-items:center;padding:44px 0 36px}
.hero h1{max-width:14ch;margin-bottom:.4em}
.lead{font-size:1.125rem;color:var(--muted);max-width:52ch}
.hero-search{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow);margin:22px 0 14px}
.hero-search input,.hero-search select{border:0;background:var(--surface-2)}
.board{background:var(--text);color:var(--bg);border-radius:14px 14px 14px 4px;padding:18px}
.board h2{font-size:1.05rem;color:var(--bg);margin-bottom:10px}
.board a.b-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px;margin-top:8px;border-radius:9px;background:color-mix(in srgb,var(--bg) 10%,transparent);color:var(--bg);text-decoration:none}
.board a.b-row:hover{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg)}
.board .b-t{font-weight:600}
.board .b-m{font-size:.82rem;opacity:.8}
.board .b-p{font:700 1rem var(--font-display);color:var(--accent);text-align:right}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .board{background:var(--surface-2);color:var(--text)}:root:not([data-theme="light"]) .board h2,:root:not([data-theme="light"]) .board a.b-row,:root:not([data-theme="light"]) .board a.b-row:hover{color:var(--text)}}
:root[data-theme="dark"] .board{background:var(--surface-2);color:var(--text)}
:root[data-theme="dark"] .board h2,:root[data-theme="dark"] .board a.b-row,:root[data-theme="dark"] .board a.b-row:hover{color:var(--text)}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero-search{grid-template-columns:1fr}}

/* categories */
.cat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cat-tile{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--text);font-weight:600;font-size:.92rem;line-height:1.25}
.cat-tile:hover{border-color:var(--line-strong);color:var(--text);box-shadow:var(--shadow)}
.cat-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:1.2rem;background:color-mix(in srgb,hsl(var(--h) 70% 50%) 20%,var(--surface))}
.cat-ico.sm{width:30px;height:30px;font-size:1rem;border-radius:8px;flex:none}
@media (max-width:900px){.cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.section{margin-top:44px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;counter-reset:s}
.step{position:relative;padding:20px 20px 20px 64px}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:18px;top:18px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font:800 1.05rem var(--font-display)}
@media (max-width:860px){.steps,.g3,.g4{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}

/* chips, stars, avatar */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--text);white-space:nowrap}
.chip.status{--c:var(--c-open);background:color-mix(in srgb,var(--c) 15%,var(--surface));color:color-mix(in srgb,var(--c) 78%,var(--text))}
.chip.s1{--c:var(--c-selected)}.chip.s2{--c:var(--c-funded)}.chip.s3{--c:var(--c-progress)}.chip.s4{--c:var(--c-await)}.chip.s5{--c:var(--c-done)}
.chip.neutral{background:var(--surface-2)}
.chip.warn{background:color-mix(in srgb,var(--accent) 28%,var(--surface));color:var(--text)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.stars{display:inline-block;position:relative;font-size:.95rem;letter-spacing:1px;line-height:1;vertical-align:-1px}
.stars::before{content:"★★★★★";color:var(--line-strong)}
.stars::after{content:"★★★★★";position:absolute;left:0;top:0;width:var(--p,0%);overflow:hidden;white-space:nowrap;color:var(--star)}
.rating{display:inline-flex;gap:6px;align-items:center;font-size:.88rem}
.rating b{font-weight:700}
.avatar{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--surface-2);color:var(--text);font:700 .85rem var(--font-display)}
.starpick{display:inline-flex;flex-direction:row-reverse;gap:2px}
.starpick input{position:absolute;opacity:0;width:1px;height:1px}
.starpick label{margin:0;font-size:1.9rem;line-height:1;color:var(--line-strong);cursor:pointer;padding:0 2px}
.starpick input:checked~label,.starpick label:hover,.starpick label:hover~label{color:var(--star)}
.starpick input:focus-visible+label{outline:2px solid var(--focus);border-radius:4px}

/* cards for jobs / workers */
.job-card{display:flex;gap:14px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--text)}
.job-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow);color:var(--text)}
.job-card h3{margin:0 0 4px;font-size:1.08rem}
.job-card .excerpt{color:var(--muted);font-size:.92rem;margin:6px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jc-body{flex:1;min-width:0}
.jc-side{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.price{font:800 1.15rem var(--font-display);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}
.worker-card{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.worker-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.worker-card .wc-top{display:flex;gap:12px;align-items:center}
.worker-card h3{margin:0;font-size:1.05rem}
.worker-card h3 a{color:var(--text);text-decoration:none}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.layout-filter{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
@media (max-width:900px){.layout-filter{grid-template-columns:1fr}.filters{position:static}}
.layout-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.layout-main aside{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
@media (max-width:980px){.layout-main{grid-template-columns:1fr}.layout-main aside{position:static}}
.empty{padding:36px 20px;text-align:center;border:1px dashed var(--line-strong);border-radius:14px;color:var(--muted)}
.empty h3{color:var(--text)}

/* status rail: the signature element */
.rail{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);margin:18px 0 6px;padding:0}
.rail li{position:relative;text-align:center;font-size:.78rem;font-weight:600;color:var(--muted);padding:0 4px}
.rail li::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.rail li:first-child::before{display:none}
.rail li.done::before,.rail li.now::before{background:var(--accent)}
.rail .dot{position:relative;z-index:1;display:block;width:24px;height:24px;margin:0 auto 6px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.rail li.done .dot{background:var(--accent);border-color:var(--accent)}
.rail li.now .dot{border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 30%,transparent);background:var(--surface)}
.rail li.now,.rail li.done{color:var(--text)}
.rail li.done .dot::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;color:var(--accent-text);font-weight:800}
@media (max-width:640px){
  .rail{grid-template-columns:1fr;gap:0;margin:12px 0}
  .rail li{display:flex;align-items:center;gap:10px;text-align:left;padding:5px 0}
  .rail li::before{display:none}
  .rail .dot{margin:0}
}
.mini{display:flex;gap:3px;margin-top:6px}
.mini i{width:16px;height:4px;border-radius:2px;background:var(--line)}
.mini i.on{background:var(--accent)}

/* escrow vault */
.vault{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin:14px 0}
.vault strong{font:800 1.5rem var(--font-display)}
.vault.held{background:color-mix(in srgb,var(--accent) 20%,var(--surface));border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.vault.released{background:color-mix(in srgb,var(--c-done) 14%,var(--surface));border-color:color-mix(in srgb,var(--c-done) 40%,var(--line))}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;margin:0}
.kv dt{color:var(--muted);font-size:.9rem}
.kv dd{margin:0;font-weight:500}
@media (max-width:560px){.kv{grid-template-columns:1fr;gap:0}.kv dt{margin-top:10px}}
.log{list-style:none;padding:0;margin:0;font-size:.88rem;color:var(--muted)}
.log li{padding:6px 0;border-top:1px solid var(--line)}

/* bids */
.bid{display:grid;gap:12px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.bid.best{border-color:var(--primary)}
.bid.accepted{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.bid-top{display:flex;gap:12px;align-items:center}
.bid-top .grow{flex:1;min-width:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface-2);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}
.counter{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));font-size:.9rem}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font:800 1.7rem var(--font-display)}
.stat span{color:var(--muted);font-size:.85rem}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--text);font:600 .85rem var(--font-body);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.attn{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--accent) 24%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line));margin-bottom:10px}
.rj{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.1fr) 110px auto;gap:12px 18px;align-items:center;padding:16px 18px;border:1px solid var(--line);background:var(--surface);border-radius:14px;margin-bottom:10px}
.rj .t{font-weight:700;color:var(--text);text-decoration:none;font-size:1.02rem}
.rj .money{font:800 1.05rem var(--font-display)}
.rj .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:860px){.rj{grid-template-columns:1fr}.rj .acts{justify-content:flex-start}}
table.ledger{width:100%;border-collapse:collapse;font-size:.92rem}
.ledger th,.ledger td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ledger th{font-weight:600;color:var(--muted);font-size:.82rem}
.scroll-x{overflow-x:auto}
.review{padding:16px 0;border-top:1px solid var(--line)}
.review:first-child{border-top:0;padding-top:0}
.dist{display:grid;grid-template-columns:20px 1fr 28px;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);margin:3px 0}
.dist i{display:block;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.dist i b{display:block;height:100%;background:var(--star)}
.profile-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.profile-head h1{font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:.2em}
.soon{border:1px dashed var(--line-strong);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:.9rem}
.inbox{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);overflow:hidden}
.inbox .bar{padding:10px 14px;background:var(--surface-2);font-size:.82rem;color:var(--muted);border-bottom:1px solid var(--line)}
.inbox .msg{padding:18px 18px 20px}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.role-pick input{position:absolute;opacity:0;width:1px;height:1px}
.role-pick label{margin:0;padding:14px;border:2px solid var(--line-strong);border-radius:12px;cursor:pointer;font-weight:700}
.role-pick label span{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px}
.role-pick input:checked+label{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--surface))}
.role-pick input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.divider{height:1px;background:var(--line);margin:18px 0;border:0}

/* modal, toast, demobar, footer */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(8,20,24,.55);display:grid;place-items:center;padding:20px;overflow:auto}
.modal{position:relative;width:100%;max-width:480px;background:var(--surface);border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:calc(100% - 16px);overflow:auto}
.modal.wide{max-width:760px}
.modal-x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);color:var(--text);font-size:1.2rem;cursor:pointer;line-height:1}
.modal img.big{width:100%;border-radius:10px;display:block}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;width:min(92vw,440px)}
.toast{padding:12px 16px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:500;font-size:.92rem;box-shadow:var(--shadow)}
.toast.error{background:var(--bad);color:#fff}
.demobar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--text);color:var(--bg);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.demobar .in{max-width:1160px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.85rem}
.demobar select{width:auto;max-width:230px;padding:6px 8px;font-size:.85rem}
.demobar .btn{padding:6px 10px;font-size:.8rem;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.demobar .btn:hover{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.site-footer{border-top:1px solid var(--line);margin-top:56px;padding:26px 0;color:var(--muted);font-size:.88rem}
.site-footer .container{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.notice{padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:.88rem;color:var(--muted);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>
<script>
(function () {
'use strict';

/* =====================================================================
   NEARHAND PROTOTYPE
   Layers (kept separate so each can be swapped for a real backend later):
     1. Constants + model documentation
     2. Seed data
     3. Store (persistence)         -> replace with API client / database
     4. Queries (Q)                 -> replace with API reads
     5. Services (S)                -> replace with API writes / server rules
     6. UI components, views, router
   NOTE: passwords are stored in plain text because this is a mock.
   ===================================================================== */

/* ---------- 1. Constants & models ----------
 User            {id, role:'employer'|'worker', name, email, password, phone, location, verified, avatar, createdAt}
 EmployerProfile {userId, company, about}
 WorkerProfile   {userId, headline, bio, skills[], categories[], experienceYears, experience, hourlyRate, pricingNote}
                 (portfolio[] is a planned future field)
 Job             {id, employerId, title, description, category, location, experience, budgetMin, budgetMax,
                  timeframe, materials, extra, status, workerId, agreedPrice, completionNote, history[], createdAt,
                  dispute:null (reserved for a future dispute feature)}
 Bid             {id, jobId, workerId, price, message, photos[], status:'active'|'accepted'|'rejected'|'withdrawn',
                  counter:null|{price,note,status,at}, history[], createdAt}
 Review          {id, jobId, fromId, toId, rating, text, createdAt}
 Transaction     {id, jobId, employerId, workerId, amount, fee, status:'held'|'released' ('disputed'|'refunded' later),
                  card, events[], createdAt}
*/
const STORE_KEY = 'nearhand.proto.v1';
const STATUSES = ['Open for Bids', 'Worker Selected', 'Payment Funded', 'In Progress', 'Awaiting Approval', 'Completed'];
const EXPERIENCE = ['Entry level', 'Intermediate', 'Expert'];
const CATS = [
  { id: 'plumbing', name: 'Plumbing', icon: '🔧', hue: 200 },
  { id: 'cleaning', name: 'Cleaning', icon: '🧽', hue: 170 },
  { id: 'photography', name: 'Photography', icon: '📷', hue: 285 },
  { id: 'landscaping', name: 'Landscaping & lawn care', icon: '🌿', hue: 120 },
  { id: 'handyman', name: 'Handyman & home repair', icon: '🔨', hue: 30 },
  { id: 'moving', name: 'Moving help', icon: '📦', hue: 45 },
  { id: 'tutoring', name: 'Tutoring', icon: '📚', hue: 245 },
  { id: 'pets', name: 'Pet care & dog walking', icon: '🐕', hue: 12 },
  { id: 'painting', name: 'Painting', icon: '🎨', hue: 340 },
  { id: 'tech', name: 'Computer & tech support', icon: '💻', hue: 215 }
];
const DAY = 86400000;
const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };

function portrait(seed) {
  const h = hash(seed);
  const skins = ['#F1C9A5', '#E0AC82', '#C68642', '#8D5524', '#F6D7BE', '#B97A4B'];
  const hairs = ['#2B1B12', '#5A3825', '#1C1C1C', '#B5651D', '#8A8A8A', '#D9B26F'];
  const shirts = ['#2F6F8F', '#B8552E', '#4C7A4F', '#6A4C93', '#C2933A', '#33505A'];
  const skin = skins[h % skins.length], hair = hairs[(h >> 3) % hairs.length], shirt = shirts[(h >> 5) % shirts.length];
  const long = (h >> 7) % 2 === 0;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><rect width="80" height="80" fill="hsl(${h % 360} 40% 80%)"/>` +
    (long ? `<path d="M22 36c0-18 36-18 36 0v22H22z" fill="${hair}"/>` : '') +
    `<path d="M10 80c2-17 14-25 30-25s28 8 30 25z" fill="${shirt}"/><rect x="35" y="44" width="10" height="12" rx="4" fill="${skin}"/>` +
    `<circle cx="40" cy="34" r="14" fill="${skin}"/><path d="M26 33a14 14 0 0 1 28 0c-4-5-8-7-14-7s-10 2-14 7z" fill="${hair}"/></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function workPhoto(cat, i) {
  const c = CATS.find(x => x.id === cat) || CATS[0];
  const h = (c.hue + i * 22) % 360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><rect width="160" height="160" fill="hsl(${h} 45% 72%)"/><circle cx="118" cy="40" r="46" fill="hsl(${h} 50% 82%)"/><rect y="112" width="160" height="48" fill="hsl(${h} 35% 55%)"/><text x="80" y="95" font-size="54" text-anchor="middle">${c.icon}</text><text x="80" y="143" font-size="13" text-anchor="middle" fill="#fff" font-family="sans-serif">Past project ${i + 1}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

/* ---------- 2. Seed data ---------- */
function seed() {
  const now = Date.now();
  const db = { v: 1, seq: 100, users: [], employerProfiles: [], workerProfiles: [], jobs: [], bids: [], reviews: [], transactions: [], session: { userId: null, pending: null, resetFor: null } };
  const U = (id, role, name, loc, days, phone) => db.users.push({ id, role, name, email: name.split(' ')[0].toLowerCase() + '@example.com', password: 'demo1234', phone, location: loc, verified: true, avatar: portrait(id + name), createdAt: now - days * DAY });
  const E = (userId, company, about) => db.employerProfiles.push({ userId, company, about });
  const W = (userId, headline, bio, skills, categories, years, experience, rate, pricingNote) => db.workerProfiles.push({ userId, headline, bio, skills, categories, experienceYears: years, experience, hourlyRate: rate, pricingNote });

  U('e1', 'employer', 'Dana Whitfield', 'Austin, TX', 210, '(512) 555-0142');
  U('e2', 'employer', 'Priya Raman', 'Round Rock, TX', 160, '(512) 555-0188');
  U('e3', 'employer', 'Tom Okafor', 'Cedar Park, TX', 120, '(512) 555-0126');
  U('e4', 'employer', 'Helen Brooks', 'Austin, TX', 300, '(512) 555-0171');
  U('e5', 'employer', 'Luis Mendez', 'Pflugerville, TX', 90, '(512) 555-0109');
  E('e1', '', 'Homeowner in East Austin working through a long list of house projects. I communicate quickly and keep the space ready for whoever I hire.');
  E('e2', '', 'Parent and part-time nurse. I post clear jobs with realistic budgets and pay promptly.');
  E('e3', '', 'Dad of two, one very energetic dog. Happy to give detailed instructions and plenty of notice.');
  E('e4', 'Brooks & Bean Café', 'Owner of a neighborhood café. I hire local people for the odd jobs that keep a small business running.');
  E('e5', '', 'First-time homeowner learning as I go. Always grateful for pros who explain what they are doing.');

  U('w1', 'worker', 'Marcus Reyes', 'Austin, TX', 400, '(512) 555-0201');
  U('w2', 'worker', 'Aisha Bello', 'Austin, TX', 350, '(512) 555-0202');
  U('w3', 'worker', 'Jordan Kim', 'Round Rock, TX', 280, '(512) 555-0203');
  U('w4', 'worker', 'Carlos Ortega', 'Cedar Park, TX', 330, '(512) 555-0204');
  U('w5', 'worker', 'Nina Petrova', 'Austin, TX', 240, '(512) 555-0205');
  U('w6', 'worker', 'Ben Foster', 'Pflugerville, TX', 260, '(512) 555-0206');
  U('w7', 'worker', 'Tasha Greene', 'Austin, TX', 200, '(512) 555-0207');
  U('w8', 'worker', 'Omar Haddad', 'Round Rock, TX', 310, '(512) 555-0208');
  U('w9', 'worker', 'Kelly Nguyen', 'Georgetown, TX', 270, '(512) 555-0209');
  U('w10', 'worker', 'Rick Dunn', 'Austin, TX', 180, '(512) 555-0210');
  W('w1', 'Licensed plumber for repairs, fixtures and drains', 'Master plumber with 12 years in residential work. I handle leaks, fixture installs, water heaters and stubborn drains. You get an upfront price, no surprise fees, and a clean workspace when I leave.', ['Faucet & fixture install', 'Drain clearing', 'Water heaters', 'Leak repair', 'Garbage disposals'], ['plumbing'], 12, 'Master plumber, 12 years residential. Previously with Lone Star Mechanical.', 85, 'Free estimates. $85/hr with a one-hour minimum; flat quotes for most small jobs.');
  W('w2', 'Detail-focused home and move-out cleaning', 'I run a small two-person cleaning crew. We bring our own eco-friendly supplies and work from a checklist so nothing gets missed. Move-out cleans are our specialty.', ['Deep cleaning', 'Move-out cleans', 'Post-construction', 'Eco-friendly products'], ['cleaning'], 6, '6 years cleaning homes and short-term rentals; insured.', 40, '$40/hr per cleaner or flat price by square footage.');
  W('w3', 'Portrait and small-business photographer', 'I shoot headshots, team photos and product images with natural light and a simple studio kit. Edited photos are delivered within three days.', ['Headshots', 'Product photography', 'Family portraits', 'Photo editing'], ['photography'], 8, '8 years shooting for local businesses and families.', 120, 'Sessions start at $150. Includes 15 edited photos.');
  W('w4', 'Lawn care, planting and yard cleanup', 'Born and raised in Cedar Park. I keep lawns healthy and yards tidy: mowing, edging, mulching, hedge trimming and seasonal cleanup. I bring all equipment.', ['Mowing & edging', 'Mulch & beds', 'Aeration', 'Hedge trimming', 'Sprinkler checks'], ['landscaping'], 9, '9 years running my own lawn care route.', 45, '$45/hr or per-visit pricing for regular service.');
  W('w5', 'Math and test-prep tutor for grades 6 to 12', 'Former high-school math teacher. I break problems into small steps and help students build confidence, not just finish homework.', ['Algebra', 'Geometry', 'SAT/ACT math', 'Study skills'], ['tutoring'], 5, '5 years teaching, 3 years tutoring privately.', 50, '$50 per 60-minute session; discounts for 8-session packs.');
  W('w6', 'Handyman for the small stuff that piles up', 'I take care of the repairs nobody has time for: sticky doors, drywall patches, shelves, TV mounting and furniture assembly. Honest quotes and tidy work.', ['Drywall patching', 'Doors & hardware', 'Shelving & mounting', 'Furniture assembly', 'Interior touch-up paint'], ['handyman', 'painting'], 7, '7 years as a general handyman; former property maintenance tech.', 55, '$55/hr, two-hour minimum. Flat quotes after a photo review.');
  W('w7', 'Insured dog walker and pet sitter', 'I treat every pet like family. Daily walks, drop-in visits and overnight sitting, with photo updates after each visit.', ['Dog walking', 'Pet sitting', 'Medication help', 'Puppy care'], ['pets'], 4, '4 years of professional pet care; pet first-aid certified.', 25, '$25 per 30-minute walk; $60 per overnight.');
  W('w8', 'Friendly computer and home-network help', 'I fix the tech problems that make people groan: slow laptops, Wi-Fi dead zones, printers and small-business setups. I explain things in plain language.', ['Wi-Fi setup', 'Virus removal', 'Data backup', 'Printer & POS setup', 'Windows & Mac'], ['tech'], 10, '10 years in IT support, now freelancing.', 65, '$65/hr, billed in 30-minute increments.');
  W('w9', 'Interior and exterior painter', 'Clean lines, careful prep and respect for your home. I protect floors and furniture, patch and sand properly, and leave the room ready to use.', ['Interior painting', 'Trim & cabinets', 'Color consulting', 'Wall prep'], ['painting'], 11, '11 years painting residential and small commercial spaces.', 48, 'Quotes by room or square footage; paint supplied at cost if needed.');
  W('w10', 'Moving help with a truck and strong arms', 'Local moves, apartment loading, and heavy-item hauling. I come with a 15-foot truck, dollies, blankets and a helper.', ['Loading & unloading', 'Furniture disassembly', 'Packing', 'Stairs & heavy items'], ['moving'], 7, '7 years doing local moves.', 60, '$60/hr for two movers plus truck; two-hour minimum.');

  let jn = 0, bn = 0, rn = 0, tn = 1000;
  const job = o => {
    const k = STATUSES.indexOf(o.status || STATUSES[0]);
    const created = now - o.days * DAY;
    const history = []; for (let i = 0; i <= k; i++) history.push({ status: STATUSES[i], at: created + i * Math.min(DAY * 0.8, (o.days * DAY) / 8) });
    const emp = db.users.find(u => u.id === o.emp);
    const j = { id: 'j' + (++jn), employerId: o.emp, title: o.title, description: o.desc || (o.title + '. Details are in the agreement below; message me through the app once it is available.'), category: o.cat, location: emp.location, experience: o.exp || 'Intermediate', budgetMin: o.min, budgetMax: o.max, timeframe: o.time || 'Flexible', materials: o.mat || 'Worker brings tools and supplies', extra: o.extra || '', status: STATUSES[k], workerId: o.worker || null, agreedPrice: o.price || null, completionNote: o.note || '', history, createdAt: created, dispute: null };
    db.jobs.push(j); return j;
  };
  const bid = (j, w, price, message, o = {}) => db.bids.push({ id: 'b' + (++bn), jobId: j.id, workerId: w, price, message, photos: Array.from({ length: o.photos || 0 }, (_, i) => workPhoto(j.category, i)), status: o.status || 'active', counter: o.counter || null, history: [{ type: 'bid', price, at: j.createdAt + DAY * 0.4 }], createdAt: j.createdAt + DAY * 0.4 + (o.lag || 0) * 3600000 });
  const tx = (j, status) => {
    const fundedAt = (j.history[2] || j.history[j.history.length - 1]).at;
    const t = { id: 'TX-' + (++tn), jobId: j.id, employerId: j.employerId, workerId: j.workerId, amount: j.agreedPrice, fee: 0, status, card: 'Visa •••• 4242', events: [{ type: 'funded', at: fundedAt }], createdAt: fundedAt };
    if (status === 'released') t.events.push({ type: 'released', at: j.history[5].at });
    db.transactions.push(t);
  };
  const review = (j, from, to, rating, text, offset) => db.reviews.push({ id: 'r' + (++rn), jobId: j.id, fromId: from, toId: to, rating, text, createdAt: j.history[5].at + offset * 3600000 });

  /* Historical completed jobs (with reviews both ways) */
  [
    ['e1', 'w1', 'plumbing', 'Water heater flush and inspection', 160, 95, 5, 'Marcus arrived on time, explained exactly what he was doing and left the utility closet cleaner than he found it. Fair price too.', 5, 'Dana made access easy and paid right away. Great client.'],
    ['e3', 'w1', 'plumbing', 'Replace toilet fill valve', 95, 70, 5, 'Fast, friendly and fixed it in under an hour. Will hire again.', 5, 'Clear instructions and a pleasant home to work in.'],
    ['e4', 'w1', 'plumbing', 'Clear floor drain in café kitchen', 180, 150, 4, 'Solved a drain that had been slow for months. Came after closing so we lost no business.', 5, 'Helen had everything ready and was flexible with timing.'],
    ['e2', 'w2', 'cleaning', 'Deep clean for 2BR apartment', 220, 80, 5, 'Spotless. They got into corners I had given up on. Booking them again before our next move.', 5, 'Priya was organized and the apartment was easy to work in.'],
    ['e4', 'w2', 'cleaning', 'Post-renovation cleanup', 340, 130, 5, 'Dust everywhere after our remodel and the crew handled it all. Professional and efficient.', 5, 'Great communication about what needed doing.'],
    ['e4', 'w3', 'photography', 'Staff headshots (6 people)', 450, 110, 5, 'Jordan made the whole team comfortable and the photos look fantastic. Delivered ahead of schedule.', 5, 'Helen coordinated everyone perfectly.'],
    ['e5', 'w3', 'photography', 'Family portraits at the park', 300, 60, 4, 'Lovely photos and great with the kids. A couple of shots needed extra editing but overall very happy.', 5, 'Luis was relaxed and fun to work with.'],
    ['e3', 'w4', 'landscaping', 'Spring aeration and overseeding', 280, 100, 5, 'The lawn has never looked better. Carlos showed up when he said and explained the watering schedule.', 5, 'Tom was responsive and had gates unlocked.'],
    ['e1', 'w4', 'landscaping', 'Flower bed redesign and mulch', 360, 140, 4, 'Great eye for plants and a tidy finish. Took one extra day because of rain, but he kept me posted.', 5, 'Dana knew what she wanted and was open to suggestions.'],
    ['e2', 'w5', 'tutoring', 'SAT math prep, 4 sessions', 240, 55, 5, 'My daughter went from dreading math to asking for practice problems. Patient and well prepared.', 5, 'Priya made sure sessions were quiet and on schedule.'],
    ['e5', 'w6', 'handyman', 'Mount TV and hide cables', 140, 45, 5, 'Perfectly level and you cannot see a single wire. Quick, tidy and fairly priced.', 5, 'Luis had the wall plan ready. Easy job.'],
    ['e1', 'w6', 'handyman', 'Replace cabinet hinges, fix squeaky door', 110, 170, 4, 'Everything works smoothly now. Ben was upfront about one hinge that needed a different part.', 5, 'Dana was clear about priorities.'],
    ['e3', 'w7', 'pets', 'Dog sitting over a long weekend', 210, 75, 5, 'Tasha sent daily photos and our dog was relaxed when we came home. We have already booked her for summer.', 5, 'Tom left detailed notes about the dog. Thank you!'],
    ['e4', 'w8', 'tech', 'Laptop cleanup and data backup', 120, 85, 5, 'Omar removed the malware and set up automatic backups. Explained it all in plain English.', 5, 'Helen was prepared and appreciative.'],
    ['e1', 'w9', 'painting', 'Paint guest bedroom', 420, 120, 5, 'Sharp lines, great prep and zero mess. The room looks brand new.', 5, 'Dana had colors chosen and the room cleared.'],
    ['e5', 'w9', 'painting', 'Exterior trim repaint', 520, 50, 5, 'Kelly scraped, primed and painted every window frame. Looks fantastic.', 4, 'Luis was friendly; payment confirmation took a day.'],
    ['e2', 'w10', 'moving', 'Move couch and dresser across town', 190, 65, 4, 'On time, careful with furniture and very friendly. Truck was a little tight but it all fit.', 5, 'Priya had everything labeled. Smooth move.']
  ].forEach(([emp, w, cat, title, price, days, r1, t1, r2, t2]) => {
    const j = job({ emp, title, cat, min: Math.round(price * 0.8), max: Math.round(price * 1.2), status: 'Completed', worker: w, price, days });
    bid(j, w, price, 'Happy to take this on. I can start as soon as you confirm the schedule.', { status: 'accepted' });
    tx(j, 'released');
    review(j, emp, w, r1, t1, 20); review(j, w, emp, r2, t2, 30);
  });

  /* Open jobs with bids */
  let j;
  j = job({ emp: 'e1', title: 'Replace kitchen faucet and fix slow drain', cat: 'plumbing', min: 120, max: 220, days: 2, exp: 'Intermediate', time: 'Within 2 weeks', mat: 'I provide the faucet; worker brings tools and parts', desc: 'Our kitchen faucet drips constantly and the sink drains slowly. I already bought a new pull-down faucet that needs installing, and I would like the drain snaked while you are here. The shut-off valves under the sink are easy to reach.', extra: 'Dog at home but friendly.' });
  bid(j, 'w1', 175, 'I have installed dozens of pull-down faucets and always test the drain afterwards. I can come Thursday or Saturday morning, bring a drain snake, and replace supply lines if the old ones are worn (parts at cost). Past work attached.', { photos: 2 });
  bid(j, 'w6', 150, 'I can handle both the faucet and the drain in about two hours. I do a lot of small plumbing for homeowners and will clean up after.', { lag: 5 });
  j = job({ emp: 'e1', title: 'Paint living room and hallway (about 650 sq ft of wall)', cat: 'painting', min: 500, max: 900, days: 3, exp: 'Intermediate', time: 'Next 3 to 4 weeks', mat: 'Worker supplies paint and materials', desc: 'Looking for a careful painter to repaint our living room and hallway in two soft neutrals. Walls need light patching and sanding first. Ceilings stay as they are. Furniture can be moved to the center of the room.', extra: 'Low-VOC paint preferred.' });
  bid(j, 'w9', 720, 'I would patch, sand, prime stains and apply two coats, including cutting in clean lines at ceilings and trim. I can help with color choices and use low-VOC paint. Two to three days of work.', { photos: 3 });
  db.bids[db.bids.length - 1].counter = { price: 650, note: 'Could you do it for $650 if I buy the paint myself?', status: 'pending', at: now - 1 * DAY };
  db.bids[db.bids.length - 1].history.push({ type: 'counter', price: 650, at: now - 1 * DAY });
  bid(j, 'w6', 640, 'I can do both rooms in two days. Price includes patching and two coats; paint at cost if you want me to buy it.', { lag: 9, photos: 1 });
  j = job({ emp: 'e2', title: 'Move-out deep clean for 3BR/2BA apartment', cat: 'cleaning', min: 200, max: 350, days: 1, exp: 'Entry level', time: 'This weekend or next', mat: 'Cleaner brings supplies', desc: 'We are handing back the keys on the 30th and need a thorough move-out clean: kitchen appliances inside and out, bathrooms, baseboards, blinds, and carpets vacuumed. Apartment will be empty.' });
  bid(j, 'w2', 265, 'My crew has done dozens of move-out cleans and we work from a landlord-style checklist. We can finish a 3BR in about four hours with two people.', { photos: 2 });
  j = job({ emp: 'e2', title: 'Algebra I tutoring for a 9th grader, twice a week', cat: 'tutoring', min: 300, max: 500, days: 4, exp: 'Intermediate', time: 'Starting next week', mat: 'In person at our home or at the library', desc: 'My son is struggling with equations and word problems. We would like 8 sessions (two per week, one hour each) with someone patient who can rebuild his confidence.' });
  bid(j, 'w5', 400, 'Eight one-hour sessions at $50 each. I will begin with a short diagnostic, then focus on the exact skills that are holding him back, and send you a brief summary after every session.');

/* ---------- 3. Store ---------- */
let DB;
function load() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.v === 1) return d; }
  } catch (e) { /* storage unavailable: run in memory */ }
  return seed();
}
function save() { try { window.localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ } }
const nid = p => p + (++DB.seq);

/* ---------- 4. Queries ---------- */
const Q = {
  user: id => DB.users.find(u => u.id === id),
  me: () => (DB.session.userId ? Q.user(DB.session.userId) : null),
  wp: id => DB.workerProfiles.find(p => p.userId === id),
  ep: id => DB.employerProfiles.find(p => p.userId === id),
  job: id => DB.jobs.find(j => j.id === id),
  cat: id => CATS.find(c => c.id === id) || CATS[0],
  bid: id => DB.bids.find(b => b.id === id),
  bidsFor: id => DB.bids.filter(b => b.jobId === id),
  activeBids: id => DB.bids.filter(b => b.jobId === id && b.status === 'active'),
  myBid: (jobId, wid) => DB.bids.find(b => b.jobId === jobId && b.workerId === wid),
  tx: jobId => DB.transactions.find(t => t.jobId === jobId),
  reviewsFor: uid => DB.reviews.filter(r => r.toId === uid).sort((a, b) => b.createdAt - a.createdAt),
  reviewBy: (jobId, uid) => DB.reviews.find(r => r.jobId === jobId && r.fromId === uid),
  rating: uid => { const rs = DB.reviews.filter(r => r.toId === uid); const n = rs.length; return { n, avg: n ? rs.reduce((s, r) => s + r.rating, 0) / n : 0 }; },
  completed: uid => DB.jobs.filter(j => j.status === 'Completed' && (j.workerId === uid || j.employerId === uid)).length,
  locations: () => [...new Set([...DB.users.map(u => u.location), ...DB.jobs.map(j => j.location)])].filter(Boolean).sort()
};

/* ---------- 5. Services (business rules) ---------- */
const ok = v => ({ ok: true, value: v });
const fail = e => ({ ok: false, error: e });
const advance = (job, status) => { job.status = status; job.history.push({ status, at: Date.now() }); };

const S = {
  signup(d) {
    const email = (d.email || '').trim().toLowerCase(), name = (d.name || '').trim();
    if (!['employer', 'worker'].includes(d.role)) return fail('Choose a role: Employer or Worker.');
    if (!name) return fail('Enter your full name.');
    if (!/^\S+@\S+\.\S+$/.test(email)) return fail('Enter a valid email address.');
    if ((d.password || '').length < 8) return fail('Use a password with at least 8 characters.');
    if ((d.phone || '').replace(/\D/g, '').length < 10) return fail('Enter a phone number with at least 10 digits.');
    if (!(d.location || '').trim()) return fail('Enter your city (for example, Austin, TX).');
    if (DB.users.some(u => u.email === email)) return fail('An account with this email already exists. Sign in instead.');
    const id = nid('u');
    DB.users.push({ id, role: d.role, name, email, password: d.password, phone: d.phone.trim(), location: d.location.trim(), verified: false, avatar: null, createdAt: Date.now() });
    if (d.role === 'employer') DB.employerProfiles.push({ userId: id, company: '', about: '' });
    else DB.workerProfiles.push({ userId: id, headline: '', bio: '', skills: [], categories: [], experienceYears: 0, experience: '', hourlyRate: 0, pricingNote: '' });
    DB.session.pending = id; save(); return ok(id);
  },
  verify(id) { const u = Q.user(id); if (!u) return fail('Account not found.'); u.verified = true; DB.session.pending = null; DB.session.userId = u.id; save(); return ok(u); },
  login(email, pw) {
    const u = DB.users.find(x => x.email === (email || '').trim().toLowerCase());
    if (!u || u.password !== pw) return fail('Email or password is incorrect.');
    if (!u.verified) { DB.session.pending = u.id; save(); return { ok: false, unverified: true, error: 'Verify your email before signing in.' }; }
    DB.session.userId = u.id; save(); return ok(u);
  },
  logout() { DB.session.userId = null; save(); },
  requestReset(email) { const u = DB.users.find(x => x.email === (email || '').trim().toLowerCase()); DB.session.resetFor = u ? u.id : null; save(); return ok(u || null); },
  resetPassword(pw) {
    const u = Q.user(DB.session.resetFor); if (!u) return fail('This reset link has expired. Request a new one.');
    if ((pw || '').length < 8) return fail('Use a password with at least 8 characters.');
    u.password = pw; DB.session.resetFor = null; save(); return ok(u);
  },
  saveJob(d, id, employerId) {
    const title = (d.title || '').trim(), desc = (d.description || '').trim();
    const min = Number(d.budgetMin), max = Number(d.budgetMax);
    if (!title) return fail('Add a job title.');
    if (!CATS.some(c => c.id === d.category)) return fail('Choose one of the ten categories.');
    if (desc.length < 20) return fail('Describe the work in at least 20 characters so workers can bid accurately.');
    if (!(d.location || '').trim()) return fail('Add the job location.');
    if (!(min > 0) || !(max > 0)) return fail('Enter a budget minimum and maximum.');
    if (min > max) return fail('Budget minimum cannot be higher than the maximum.');
    const fields = { title, description: desc, category: d.category, location: d.location.trim(), experience: d.experience, budgetMin: min, budgetMax: max, timeframe: (d.timeframe || '').trim() || 'Flexible', materials: (d.materials || '').trim() || 'To be agreed', extra: (d.extra || '').trim() };
    if (id) {
      const j = Q.job(id); if (!j || j.employerId !== employerId) return fail('You can only edit your own jobs.');
      if (j.status !== STATUSES[0]) return fail('Jobs can only be edited while they are open for bids.');
      Object.assign(j, fields); save(); return ok(j);
    }
    const j = Object.assign({ id: nid('j'), employerId, status: STATUSES[0], workerId: null, agreedPrice: null, completionNote: '', history: [{ status: STATUSES[0], at: Date.now() }], createdAt: Date.now(), dispute: null }, fields);
    DB.jobs.push(j); save(); return ok(j);
  },
  deleteJob(id, uid) {
    const j = Q.job(id); if (!j || j.employerId !== uid) return fail('You can only remove your own jobs.');
    if (j.status !== STATUSES[0]) return fail('Jobs that already have a hired worker cannot be removed.');
    DB.jobs = DB.jobs.filter(x => x.id !== id); DB.bids = DB.bids.filter(b => b.jobId !== id); save(); return ok();
  },
  submitBid(jobId, uid, d) {
    const j = Q.job(jobId), u = Q.user(uid);
    if (!u || u.role !== 'worker') return fail('Only workers can place bids.');
    if (!j || j.status !== STATUSES[0]) return fail('This job is no longer accepting bids.');
    const price = Number(d.price), message = (d.message || '').trim();
    if (!(price > 0)) return fail('Enter your price.');
    if (message.length < 20) return fail('Tell the employer why you are a good fit (at least 20 characters).');
    let b = Q.myBid(jobId, uid);
    if (b) {
      b.price = price; b.message = message; b.photos = d.photos || []; b.status = 'active';
      if (b.counter && b.counter.status === 'pending') b.counter.status = 'declined';
      b.history.push({ type: 'revised', price, at: Date.now() });
    } else {
      b = { id: nid('b'), jobId, workerId: uid, price, message, photos: d.photos || [], status: 'active', counter: null, history: [{ type: 'bid', price, at: Date.now() }], createdAt: Date.now() };
      DB.bids.push(b);
    }
    save(); return ok(b);
  },
  withdrawBid(id, uid) {
    const b = Q.bid(id), j = b && Q.job(b.jobId);
    if (!b || b.workerId !== uid) return fail('Bid not found.');
    if (j.status !== STATUSES[0]) return fail('Bids can only be withdrawn while the job is open.');
    b.status = 'withdrawn'; b.history.push({ type: 'withdrawn', price: b.price, at: Date.now() }); save(); return ok(b);
  },
  counter(id, uid, price, note) {
    const b = Q.bid(id), j = b && Q.job(b.jobId);
    if (!b || j.employerId !== uid) return fail('Only the job owner can counter.');
    if (j.status !== STATUSES[0] || b.status !== 'active') return fail('This bid can no longer be negotiated.');
    price = Number(price); if (!(price > 0)) return fail('Enter a counter-offer price.');
    b.counter = { price, note: (note || '').trim(), status: 'pending', at: Date.now() }; b.history.push({ type: 'counter', price, at: Date.now() }); save(); return ok(b);
  },
  respondCounter(id, uid, accept) {
    const b = Q.bid(id); if (!b || b.workerId !== uid || !b.counter || b.counter.status !== 'pending') return fail('No counter-offer to answer.');
    if (accept) { b.price = b.counter.price; b.counter.status = 'accepted'; b.history.push({ type: 'accepted-counter', price: b.price, at: Date.now() }); }
    else { b.counter.status = 'declined'; b.history.push({ type: 'declined-counter', price: b.price, at: Date.now() }); }
    save(); return ok(b);
  },
  hire(bidId, uid) {
    const b = Q.bid(bidId), j = b && Q.job(b.jobId);
    if (!b || j.employerId !== uid) return fail('Only the job owner can hire.');
    if (j.status !== STATUSES[0] || b.status !== 'active') return fail('This job is no longer open.');
    Q.bidsFor(j.id).forEach(x => { if (x.id !== b.id && x.status === 'active') x.status = 'rejected'; });
    b.status = 'accepted'; j.workerId = b.workerId; j.agreedPrice = b.price; advance(j, 'Worker Selected'); save(); return ok(j);
  },
  fund(jobId, uid) {
    const j = Q.job(jobId); if (!j || j.employerId !== uid) return fail('Only the job owner can fund the job.');
    if (j.status !== 'Worker Selected') return fail('Escrow can be funded after a worker is selected.');
    const t = { id: 'TX-' + (++DB.seq + 1000), jobId, employerId: uid, workerId: j.workerId, amount: j.agreedPrice, fee: 0, status: 'held', card: 'Visa •••• 4242', events: [{ type: 'funded', at: Date.now() }], createdAt: Date.now() };
    DB.transactions.push(t); advance(j, 'Payment Funded'); save(); return ok(t);
  },
  start(jobId, uid) {
    const j = Q.job(jobId); if (!j || j.workerId !== uid) return fail('Only the hired worker can start the job.');
    if (j.status !== 'Payment Funded') return fail('Work can start once escrow is funded.');
    advance(j, 'In Progress'); save(); return ok(j);
  },
  complete(jobId, uid, note) {
    const j = Q.job(jobId); if (!j || j.workerId !== uid) return fail('Only the hired worker can mark the job complete.');
    if (j.status !== 'In Progress') return fail('The job must be in progress first.');
    j.completionNote = (note || '').trim(); advance(j, 'Awaiting Approval'); save(); return ok(j);
  },
  confirm(jobId, uid) {
    const j = Q.job(jobId); if (!j || j.employerId !== uid) return fail('Only the job owner can confirm completion.');
    if (j.status !== 'Awaiting Approval') return fail('The worker has not marked this job complete yet.');
    const t = Q.tx(jobId); if (t) { t.status = 'released'; t.events.push({ type: 'released', at: Date.now() }); }
    advance(j, 'Completed'); save(); return ok(j);
  },
  review(jobId, uid, rating, text) {
    const j = Q.job(jobId); if (!j || j.status !== 'Completed') return fail('Reviews open once a job is completed.');
    if (uid !== j.employerId && uid !== j.workerId) return fail('Only the employer and worker on this job can review it.');
    if (Q.reviewBy(jobId, uid)) return fail('You already reviewed this job.');
    rating = Number(rating); if (!(rating >= 1 && rating <= 5)) return fail('Choose a star rating from 1 to 5.');
    if ((text || '').trim().length < 10) return fail('Write at least a sentence (10 characters) so the review is useful.');
    DB.reviews.push({ id: nid('r'), jobId, fromId: uid, toId: uid === j.employerId ? j.workerId : j.employerId, rating, text: text.trim(), createdAt: Date.now() });
    save(); return ok();
  },
  saveSettings(uid, d) {
    const u = Q.user(uid); if (!u) return fail('Account not found.');
    if (!(d.name || '').trim()) return fail('Name cannot be empty.');
    if ((d.phone || '').replace(/\D/g, '').length < 10) return fail('Enter a phone number with at least 10 digits.');
    if (!(d.location || '').trim()) return fail('Location cannot be empty.');
    u.name = d.name.trim(); u.phone = d.phone.trim(); u.location = d.location.trim(); if (d.avatar) u.avatar = d.avatar;
    if (u.role === 'worker') {
      const p = Q.wp(uid); Object.assign(p, { headline: (d.headline || '').trim(), bio: (d.bio || '').trim(), skills: (d.skills || '').split(',').map(s => s.trim()).filter(Boolean), categories: d.categories || [], experienceYears: Number(d.experienceYears) || 0, experience: (d.experience || '').trim(), hourlyRate: Number(d.hourlyRate) || 0, pricingNote: (d.pricingNote || '').trim() });
    } else { const p = Q.ep(uid); Object.assign(p, { company: (d.company || '').trim(), about: (d.about || '').trim() }); }
    save(); return ok(u);
  },
  resetDemo() { DB = seed(); save(); }
};

/* ---------- 6. UI helpers & components ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmtDate = ts => new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const ago = ts => {
  const m = (Date.now() - ts) / 60000;
  if (m < 60) return 'just now';
  if (m < 1440) return Math.floor(m / 60) + 'h ago';
  if (m < 43200) return Math.floor(m / 1440) + 'd ago';
  return fmtDate(ts);
};
const first = n => String(n || '').split(' ')[0];
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

const ui = { dashTab: 'all', workerTab: 'action', resetSent: false, photos: [], avatar: null, menu: false };
let route = { path: [], query: {} };
const FIL = {
  jobs: { q: '', cat: '', loc: '', min: '', max: '', sort: 'new' },

};

};
const catIcon = (id, sm) => { const c = Q.cat(id); return `<span class="cat-ico ${sm ? 'sm' : ''}" style="--h:${c.hue}" aria-hidden="true">${c.icon}</span>`; };
const statusChip = j => `<span class="chip status s${STATUSES.indexOf(j.status)}">${j.status}</span>`;

const jobCard = j => {

const workerCard = u => {

/* Jobs browse */
function filterJobs() {
  const f = FIL.jobs; const words = f.q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = DB.jobs.filter(j => j.status === STATUSES[0]);
  list = list.filter(j => {
    const hay = (j.title + ' ' + j.description + ' ' + Q.cat(j.category).name + ' ' + j.location + ' ' + j.extra).toLowerCase();
    if (!words.every(w => hay.includes(w))) return false;
    if (f.cat && j.category !== f.cat) return false;
    if (f.loc && j.location !== f.loc) return false;
    if (f.min !== '' && j.budgetMax < Number(f.min)) return false;
    if (f.max !== '' && j.budgetMin > Number(f.max)) return false;
    return true;
  });
  const s = f.sort;
  list.sort((a, b) => s === 'budget' ? b.budgetMax - a.budgetMax : s === 'bids' ? Q.activeBids(a.id).length - Q.activeBids(b.id).length : b.createdAt - a.createdAt);
  return list;
}
const jobResults = () => { const l = filterJobs(); return { count: plural(l.length, 'open job'), html: l.length ? l.map(jobCard).join('') : empty('No jobs match those filters', 'Try a broader keyword, another category, or clear the filters.', '<button class="btn btn-outline" data-act="clearFilters" data-kind="jobs">Clear filters</button>') }; };
V.jobs = () => {
  const f = FIL.jobs, r = jobResults(), me = Q.me();
  return `<div class="page"><div class="page-head spread"><div><h1 style="font-size:2rem">Find jobs</h1><p class="muted" style="margin:0">Open jobs near you. Filter by category, location and budget, then place a bid.</p></div>${me && me.role === 'employer' ? '<a class="btn btn-accent" href="#/post">Post a job</a>' : ''}</div>
  <div class="layout-filter"><form class="card filters" data-filters="jobs" onsubmit="return false" role="search"><h3>Filters</h3>
  ${field('Keyword', `<input type="text" name="q" value="${esc(f.q)}" placeholder="faucet, mowing, headshots">`)}
  ${field('Category', `<select name="cat"><option value="">All categories</option>${catOptions(f.cat)}</select>`)}
  ${field('Location', `<select name="loc"><option value="">Any location</option>${locOptions(f.loc)}</select>`)}
  <div class="form-grid"><div class="field"><label>Budget from</label><input type="number" name="min" min="0" value="${esc(f.min)}" placeholder="$0"></div><div class="field"><label>Budget to</label><input type="number" name="max" min="0" value="${esc(f.max)}" placeholder="$1000"></div></div>
  ${field('Sort by', `<select name="sort"><option value="new" ${f.sort === 'new' ? 'selected' : ''}>Newest</option><option value="budget" ${f.sort === 'budget' ? 'selected' : ''}>Highest budget</option><option value="bids" ${f.sort === 'bids' ? 'selected' : ''}>Fewest bids</option></select>`)}
  <button type="button" class="btn btn-outline btn-block" data-act="clearFilters" data-kind="jobs">Clear filters</button></form>
  <section aria-live="polite"><p class="muted small" id="count">${r.count}</p><div class="stack" id="results">${r.html}</div></section></div></div>`;
};

/* Workers browse */
function filterWorkers() {
  const f = FIL.workers; const words = f.q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = DB.users.filter(u => u.role === 'worker' && u.verified);
  list = list.filter(u => {
    const p = Q.wp(u.id) || {};
    const hay = (u.name + ' ' + (p.headline || '') + ' ' + (p.bio || '') + ' ' + (p.skills || []).join(' ') + ' ' + (p.categories || []).map(c => Q.cat(c).name).join(' ')).toLowerCase();
    if (!words.every(w => hay.includes(w))) return false;
    if (f.cat && !(p.categories || []).includes(f.cat)) return false;
    if (f.loc && u.location !== f.loc) return false;
    if (f.rating && Q.rating(u.id).avg < Number(f.rating)) return false;
    if (f.rate !== '' && (p.hourlyRate || 0) > Number(f.rate)) return false;
    return true;
  });
  const s = f.sort;
  list.sort((a, b) => s === 'jobs' ? Q.completed(b.id) - Q.completed(a.id) : s === 'rate' ? ((Q.wp(a.id) || {}).hourlyRate || 0) - ((Q.wp(b.id) || {}).hourlyRate || 0) : Q.rating(b.id).avg - Q.rating(a.id).avg || Q.completed(b.id) - Q.completed(a.id));
  return list;
}
const workerResults = () => { const l = filterWorkers(); return { count: plural(l.length, 'worker'), html: l.length ? l.map(workerCard).join('') : empty('No workers match those filters', 'Try removing a filter or searching a different skill.', '<button class="btn btn-outline" data-act="clearFilters" data-kind="workers">Clear filters</button>') }; };

      <aside><section class="card"><h3>Pricing</h3><div class="price" style="font-size:1.6rem">${p.hourlyRate ? money(p.hourlyRate) + '/hr' : 'Not set'}</div><p class="small muted" style="margin:6px 0 0">${esc(p.pricingNote || '')}</p></section>

/* Job detail */
function bidCard(b, j, best) {
  const w = Q.user(b.workerId), p = Q.wp(w.id) || {}, canAct = j.status === STATUSES[0] && b.status === 'active';
  const chip = b.status === 'accepted' ? '<span class="chip status s5">Hired</span>' : b.status === 'rejected' ? '<span class="chip neutral">Not selected</span>' : b.status === 'withdrawn' ? '<span class="chip neutral">Withdrawn</span>' : '';
  const c = b.counter;
  const cBlock = c ? `<div class="counter">${c.status === 'pending' ? `You countered with <b>${money(c.price)}</b>${c.note ? ': "' + esc(c.note) + '"' : ''}. Waiting for ${esc(first(w.name))} to respond.` : c.status === 'accepted' ? `${esc(first(w.name))} accepted your counter-offer of <b>${money(c.price)}</b>.` : `${esc(first(w.name))} declined your counter-offer of ${money(c.price)}.`}</div>` : '';
  return `<article class="bid ${b.status === 'accepted' ? 'accepted' : best ? 'best' : ''}"><div class="bid-top">${avatar(w, 48)}<div class="grow"><a href="#/profile/${w.id}"><b>${esc(w.name)}</b></a>
  <div class="meta">${ratingLine(w.id)}<span>${plural(Q.completed(w.id), 'job')} done</span>${p.hourlyRate ? `<span>${money(p.hourlyRate)}/hr</span>` : ''}<span>${esc(w.location)}</span></div></div>
  <div style="text-align:right"><div class="price">${money(b.price)}</div>${best && canAct ? '<span class="chip warn">Lowest bid</span>' : ''}${chip}</div></div>
  <p style="margin:0">${esc(b.message)}</p>${photosHtml(b)}${cBlock}${bidHistory(b)}

function myBidPanel(j, me) {

  <div class="field"><label for="bidPhotos">Photos of previous work <span class="muted">(optional, up to 4)</span></label><input id="bidPhotos" type="file" accept="image/*" multiple><div class="thumbs" id="photoThumbs" style="margin-top:8px">${thumbsHtml()}</div></div>
  <div class="row"><button class="btn btn-primary">${active ? 'Update bid' : b ? 'Submit bid again' : 'Submit bid'}</button>${active ? `<button type="button" class="btn btn-danger" data-act="withdrawBid" data-bid="${b.id}">Withdraw bid</button>` : ''}</div></form>`;

const thumbsHtml = () => ui.photos.map((p, i) => `<span class="thumb" style="cursor:default"><img src="${p}" alt="Selected photo ${i + 1}"><button type="button" class="x" data-act="rmPhoto" data-i="${i}" aria-label="Remove photo ${i + 1}">×</button></span>`).join('');

function agreementPanel(j, me) {
  const emp = Q.user(j.employerId), w = Q.user(j.workerId), t = Q.tx(j.id);
  const isEmp = me && me.id === j.employerId, isW = me && me.id === j.workerId;
  const vault = t ? (t.status === 'held' ? `<div class="vault held"><div><div class="small">Held in escrow by Nearhand</div><strong>${money(t.amount)}</strong></div><div class="small">The money stays here until the employer confirms the work is complete.</div></div>`
    : `<div class="vault released"><div><div class="small">Released to ${esc(first(w.name))}</div><strong>${money(t.amount)}</strong></div><div class="small">Paid out ${fmtDate(t.events[t.events.length - 1].at)}. Platform fee: $0.00</div></div>`)
    : `<div class="vault"><div><div class="small">Escrow not funded yet</div><strong>${money(j.agreedPrice)}</strong></div><div class="small">The employer pays this amount into escrow to start the job.</div></div>`;
  let act = '';
  if (j.status === 'Worker Selected') act = isEmp ? `<button class="btn btn-accent" data-act="askFund">Fund escrow: ${money(j.agreedPrice)}</button>` : isW ? '<div class="notice">You have been selected. Work starts once the employer funds escrow.</div>' : '';
  if (j.status === 'Payment Funded') act = isW ? '<button class="btn btn-primary" data-act="startWork">Start work</button>' : isEmp ? '<div class="notice">Escrow is funded. Waiting for the worker to start.</div>' : '';
  if (j.status === 'In Progress') act = isW ? `<div class="field"><label for="doneNote">Note for the employer (optional)</label><textarea id="doneNote" rows="3" placeholder="Summarize what you completed"></textarea></div><button class="btn btn-primary" data-act="markComplete">Mark work complete</button>` : isEmp ? '<div class="notice">Work is in progress. You will be asked to confirm when the worker marks it complete.</div>' : '';
  if (j.status === 'Awaiting Approval') act = `${j.completionNote ? `<div class="counter" style="margin-bottom:12px"><b>${esc(first(w.name))}'s note:</b> ${esc(j.completionNote)}</div>` : ''}` + (isEmp ? `<button class="btn btn-accent" data-act="askConfirm">Confirm work and release ${money(j.agreedPrice)}</button>` : isW ? '<div class="notice">You marked this job complete. Payment is released when the employer confirms.</div>' : '');
  const log = t ? `<ul class="log">${t.events.map(e => `<li>${fmtDate(e.at)}: ${e.type === 'funded' ? `${esc(emp.name)} paid ${money(t.amount)} into escrow (${t.card}, demo card)` : `${money(t.amount)} released to ${esc(w.name)}`}</li>`).join('')}</ul>` : '';
  return `<section class="card raised"><div class="spread"><h2 style="margin:0">Agreement</h2>${statusChip(j)}</div>
  <dl class="kv" style="margin-top:14px"><dt>Employer</dt><dd><a href="#/profile/${emp.id}">${esc(emp.name)}</a></dd><dt>Worker</dt><dd><a href="#/profile/${w.id}">${esc(w.name)}</a></dd><dt>Agreed price</dt><dd><b>${money(j.agreedPrice)}</b> (platform fee $0.00)</dd><dt>Job</dt><dd>${esc(j.title)}</dd><dt>Scope of work</dt><dd>${esc(j.description)}</dd><dt>Status</dt><dd>${j.status}</dd></dl>
  ${vault}${act}${log}<div class="row" style="margin-top:14px"><button class="btn btn-outline btn-sm" disabled title="Messaging is a planned feature">Message (coming soon)</button><button class="btn btn-outline btn-sm" disabled title="Dispute handling is a planned feature">Report a problem (coming soon)</button></div></section>`;
}
function reviewsPanel(j, me) {

  let form = '';

    ${field('Your review', `<textarea name="text" rows="4" required placeholder="${me.role === 'employer' ? 'How was the work, communication and timing?' : 'How was the employer to work with?'}"></textarea>`)}<button class="btn btn-primary">Submit review</button></form>`;

V.job = id => {
  const j = Q.job(id); if (!j) return notFound('job');
  const me = Q.me(), emp = Q.user(j.employerId), c = Q.cat(j.category);
  const isOwner = me && me.id === j.employerId, isWorker = me && me.role === 'worker', isHired = me && j.workerId === me.id, open = j.status === STATUSES[0];
  const bids = Q.bidsFor(j.id).filter(b => b.status !== 'withdrawn').sort((a, b) => (a.status === 'accepted' ? -1 : b.status === 'accepted' ? 1 : a.price - b.price));
  const lowest = Math.min(...Q.activeBids(j.id).map(b => b.price));
  let main = `<section class="card"><div class="row" style="align-items:flex-start">${catIcon(c.id)}<div style="flex:1;min-width:220px"><h1 style="font-size:clamp(1.5rem,3vw,2rem);margin-bottom:6px">${esc(j.title)}</h1><div class="meta"><span>${esc(c.name)}</span><span>${esc(j.location)}</span><span>Posted ${ago(j.createdAt)}</span></div></div><div style="text-align:right"><div class="price" style="font-size:1.4rem">${money(j.budgetMin)} to ${money(j.budgetMax)}</div>${statusChip(j)}</div></div>${stepper(j)}</section>
  <section class="card"><h3>Description</h3><p style="white-space:pre-wrap">${esc(j.description)}</p>
  <dl class="kv"><dt>Experience</dt><dd>${j.experience}</dd><dt>Timeframe</dt><dd>${esc(j.timeframe)}</dd><dt>Tools and materials</dt><dd>${esc(j.materials)}</dd>${j.extra ? `<dt>Other details</dt><dd>${esc(j.extra)}</dd>` : ''}</dl></section>`;
  if (isOwner && open) {
    const act = Q.activeBids(j.id);
    main += `<section class="stack"><div class="spread"><h2 style="margin:0">Bids (${act.length})</h2><div class="row"><a class="btn btn-outline btn-sm" href="#/post/${j.id}">Edit job</a><button class="btn btn-danger btn-sm" data-act="askDelete">Remove job</button></div></div>
    ${act.length ? act.sort((a, b) => a.price - b.price).map(b => bidCard(b, j, act.length > 1 && b.price === lowest)).join('') : empty('No bids yet', 'Workers nearby can see this job. Check back soon or browse workers and share the link.', '<a class="btn btn-outline" href="#/workers">Browse workers</a>')}</section>`;
  }
  if (j.workerId && (isOwner || isHired)) main += agreementPanel(j, me);
  if (isOwner && !open) main += `<section class="card"><h3>Bids received</h3><div class="stack">${bids.map(b => `<div class="row" style="justify-content:space-between"><span class="row">${avatar(Q.user(b.workerId), 32)}<a href="#/profile/${b.workerId}">${esc(Q.user(b.workerId).name)}</a></span><span class="row"><b>${money(b.price)}</b>${b.status === 'accepted' ? '<span class="chip status s5">Hired</span>' : '<span class="chip neutral">Not selected</span>'}</span></div>`).join('')}</div></section>`;
  if (j.status === 'Completed' && (isOwner || isHired)) main += reviewsPanel(j, me);
  else if (j.status === 'Completed') main += `<section class="card"><h3>Reviews</h3>${DB.reviews.filter(r => r.jobId === j.id).map(reviewItem).join('') || '<p class="muted" style="margin:0">No reviews yet.</p>'}</section>`;

  let side = `<section class="card"><h3>About the employer</h3><div class="row">${avatar(emp, 48)}<div><a href="#/profile/${emp.id}"><b>${esc(emp.name)}</b></a><div>${ratingLine(emp.id)}</div></div></div><dl class="kv" style="grid-template-columns:110px 1fr;margin-top:12px"><dt>Location</dt><dd>${esc(emp.location)}</dd><dt>Member since</dt><dd>${fmtDate(emp.createdAt)}</dd><dt>Jobs completed</dt><dd>${Q.completed(emp.id)}</dd></dl></section>`;
  if (!me) side = `<section class="card raised"><h3>Want to bid on this job?</h3><p class="muted">Sign in or create a worker account to send a bid.</p><a class="btn btn-primary btn-block" href="#/login">Sign in</a><p class="small" style="margin:10px 0 0">New? <a href="#/signup?role=worker">Create a worker account</a></p></section>` + side;
  else if (isWorker && open) side = myBidPanel(j, me) + side;
  else if (isWorker && !open && !isHired) side = `<section class="card"><h3>Bidding closed</h3><p class="muted" style="margin:0">An employer selected a worker, so this job no longer accepts bids.</p></section>` + side;
  else if (me.role === 'employer' && !isOwner) side = `<section class="notice">You are signed in as an employer. Only workers can bid, and only ${esc(first(emp.name))} can manage this job.</section>` + side;
  return `<div class="page"><p class="small"><a href="#/jobs">← All jobs</a></p><div class="layout-main"><div class="stack">${main}</div><aside>${side}</aside></div></div>`;
};

/* Dashboards */
