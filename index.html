  const tab = ui.dashTab;
  const inFlight = mine.filter(j => ['Worker Selected', 'Payment Funded', 'In Progress', 'Awaiting Approval'].includes(j.status));
  const list = mine.filter(j => tab === 'all' ? true : tab === 'open' ? j.status === STATUSES[0] : tab === 'hired' ? inFlight.includes(j) : j.status === 'Completed');
  const needFund = mine.filter(j => j.status === 'Worker Selected'), needApprove = mine.filter(j => j.status === 'Awaiting Approval');
  const needReview = mine.filter(j => j.status === 'Completed' && !Q.reviewBy(j.id, me.id));
  const held = DB.transactions.filter(t => t.employerId === me.id && t.status === 'held').reduce((s, t) => s + t.amount, 0);
  const attn = [...needFund.map(j => `<div class="attn"><span><b>${esc(j.title)}</b>: ${esc(first(Q.user(j.workerId).name))} is selected. Fund escrow to start.</span><a class="btn btn-accent btn-sm" href="#/job/${j.id}">Fund escrow</a></div>`),
    ...needApprove.map(j => `<div class="attn"><span><b>${esc(j.title)}</b>: ${esc(first(Q.user(j.workerId).name))} marked the work complete.</span><a class="btn btn-accent btn-sm" href="#/job/${j.id}">Review and approve</a></div>`),
    ...needReview.map(j => `<div class="attn"><span><b>${esc(j.title)}</b> is complete. Share how it went.</span><a class="btn btn-outline btn-sm" href="#/job/${j.id}">Leave a review</a></div>`)].join('');
  const tabs = [['all', 'All jobs', mine.length], ['open', 'Open for bids', mine.filter(j => j.status === STATUSES[0]).length], ['hired', 'Hired and active', inFlight.length], ['done', 'Completed', mine.filter(j => j.status === 'Completed').length]];
  const row = j => {
    const nb = Q.activeBids(j.id).length, w = j.workerId ? Q.user(j.workerId) : null;
    let acts = `<a class="btn btn-outline btn-sm" href="#/job/${j.id}">${j.status === STATUSES[0] ? 'View bids' : 'View'}</a>`;
    if (j.status === STATUSES[0]) acts += `<a class="btn btn-outline btn-sm" href="#/post/${j.id}">Edit</a><button class="btn btn-danger btn-sm" data-act="askDelete" data-id="${j.id}">Remove</button>`;
    return `<article class="rj"><div><a class="t" href="#/job/${j.id}">${esc(j.title)}</a><div class="meta"><span>${esc(Q.cat(j.category).name)}</span><span>Posted ${ago(j.createdAt)}</span>${w ? `<span>Hired: ${esc(w.name)}</span>` : ''}</div></div>
    <div>${statusChip(j)}${miniRail(j)}</div><div><div class="money">${money(j.agreedPrice || j.budgetMax)}</div><div class="small muted">${j.agreedPrice ? 'agreed price' : 'up to, ' + plural(nb, 'bid')}</div></div><div class="acts">${acts}</div></article>`;
  };
  return `<div class="page"><div class="page-head spread"><div><h1 style="font-size:2rem">Your jobs</h1><p class="muted" style="margin:0">Track every job you have posted and what needs your attention.</p></div><a class="btn btn-accent" href="#/post">Post a job</a></div>
  <div class="stats"><div class="stat"><b>${mine.filter(j => j.status === STATUSES[0]).length}</b><span>Open for bids</span></div><div class="stat"><b>${inFlight.length}</b><span>Hired and active</span></div><div class="stat"><b>${mine.filter(j => j.status === 'Completed').length}</b><span>Completed</span></div><div class="stat"><b>${money(held)}</b><span>Currently in escrow</span></div></div>
  ${attn}<div class="tabs" role="group" aria-label="Filter jobs" style="margin-top:14px">${tabs.map(t => `<button class="tab" data-act="dashTab" data-tab="${t[0]}" aria-pressed="${tab === t[0]}">${t[1]} (${t[2]})</button>`).join('')}</div>
  ${list.length ? list.map(row).join('') : empty('No jobs here yet', 'Post your first job to start receiving bids.', '<a class="btn btn-primary" href="#/post">Post a job</a>')}</div>`;
}
function workerDashboard(me) {
  const p = Q.wp(me.id) || {}, r = Q.rating(me.id);
  const myBids = DB.bids.filter(b => b.workerId === me.id).sort((a, b) => b.createdAt - a.createdAt);
  const jobs = DB.jobs.filter(j => j.workerId === me.id).sort((a, b) => b.createdAt - a.createdAt);
  const actionJobs = jobs.filter(j => ['Payment Funded', 'In Progress'].includes(j.status));
  const counters = myBids.filter(b => b.status === 'active' && b.counter && b.counter.status === 'pending' && Q.job(b.jobId));
  const waiting = jobs.filter(j => ['Worker Selected', 'Awaiting Approval'].includes(j.status));
  const needReview = jobs.filter(j => j.status === 'Completed' && !Q.reviewBy(j.id, me.id));
  const held = DB.transactions.filter(t => t.workerId === me.id && t.status === 'held').reduce((s, t) => s + t.amount, 0);
  const paid = DB.transactions.filter(t => t.workerId === me.id && t.status === 'released').reduce((s, t) => s + t.amount, 0);
  const complete = !!(p.headline && p.bio && p.skills && p.skills.length && p.hourlyRate);
  const tab = ui.workerTab;
  const attn = [...counters.map(b => { const j = Q.job(b.jobId); return `<div class="attn"><span><b>${esc(j.title)}</b>: ${esc(first(Q.user(j.employerId).name))} countered at ${money(b.counter.price)}.</span><a class="btn btn-accent btn-sm" href="#/job/${j.id}">Respond</a></div>`; }),
    ...actionJobs.map(j => `<div class="attn"><span><b>${esc(j.title)}</b>: ${j.status === 'Payment Funded' ? 'escrow is funded. You can start work.' : 'work is in progress. Mark it complete when done.'}</span><a class="btn btn-accent btn-sm" href="#/job/${j.id}">${j.status === 'Payment Funded' ? 'Start work' : 'Open job'}</a></div>`),
    ...needReview.map(j => `<div class="attn"><span><b>${esc(j.title)}</b> is complete. Review the employer.</span><a class="btn btn-outline btn-sm" href="#/job/${j.id}">Leave a review</a></div>`)].join('');
  const bidLabel = b => { const j = Q.job(b.jobId); if (!j) return ['Job removed', 'neutral']; if (b.status === 'accepted') return ['Hired', 's5']; if (b.status === 'rejected') return ['Not selected', 'neutral']; if (b.status === 'withdrawn') return ['Withdrawn', 'neutral']; if (b.counter && b.counter.status === 'pending') return ['Counter-offer received', 'warn']; return ['Pending', 'neutral']; };
  const bidRow = b => { const j = Q.job(b.jobId); if (!j) return ''; const l = bidLabel(b); const e = Q.user(j.employerId); return `<article class="rj"><div><a class="t" href="#/job/${j.id}">${esc(j.title)}</a><div class="meta"><span>${esc(e.name)}</span><span>${esc(j.location)}</span><span>Bid ${ago(b.createdAt)}</span></div></div><div><span class="chip ${l[1] === 's5' ? 'status s5' : l[1]}">${l[0]}</span></div><div><div class="money">${money(b.price)}</div><div class="small muted">your bid</div></div><div class="acts"><a class="btn btn-outline btn-sm" href="#/job/${j.id}">${j.status === STATUSES[0] && b.status !== 'withdrawn' ? 'Edit or withdraw' : 'View'}</a></div></article>`; };
  const jobRow = j => { const e = Q.user(j.employerId); return `<article class="rj"><div><a class="t" href="#/job/${j.id}">${esc(j.title)}</a><div class="meta"><span>${esc(e.name)}</span><span>${esc(j.location)}</span></div></div><div>${statusChip(j)}${miniRail(j)}</div><div><div class="money">${money(j.agreedPrice)}</div><div class="small muted">agreed price</div></div><div class="acts"><a class="btn btn-outline btn-sm" href="#/job/${j.id}">Open</a></div></article>`; };
  const activeBids = myBids.filter(b => Q.job(b.jobId) && (b.status === 'active' || b.status === 'rejected' || b.status === 'withdrawn'));
  const tabs = [['action', 'Active jobs', jobs.filter(j => j.status !== 'Completed').length], ['bids', 'My bids', activeBids.length], ['done', 'Completed', jobs.filter(j => j.status === 'Completed').length]];

  if (tab === 'bids') list = activeBids.map(bidRow).join('') || empty('No bids yet', 'Browse open jobs and send your first bid.', '<a class="btn btn-primary" href="#/jobs">Find jobs</a>');
  if (tab === 'done') list = jobs.filter(j => j.status === 'Completed').map(jobRow).join('') || empty('No completed jobs yet', 'Completed jobs and payments appear here.');
  return `<div class="page"><div class="page-head spread"><div><h1 style="font-size:2rem">Welcome back, ${esc(first(me.name))}</h1><p class="muted" style="margin:0">Your bids, active jobs and earnings in one place.</p></div><a class="btn btn-accent" href="#/jobs">Find jobs</a></div>
  <div class="stats"><div class="stat"><b>${r.n ? r.avg.toFixed(1) : '–'}</b><span>Average rating (${plural(r.n, 'review')})</span></div><div class="stat"><b>${Q.completed(me.id)}</b><span>Jobs completed</span></div><div class="stat"><b>${money(held)}</b><span>Held in escrow for you</span></div><div class="stat"><b>${money(paid)}</b><span>Paid out to you</span></div></div>

}
V.dashboard = () => { const me = Q.me(); return me.role === 'employer' ? employerDashboard(me) : workerDashboard(me); };

/* Payments */
V.payments = () => {
  const me = Q.me(), isE = me.role === 'employer';
  const txs = DB.transactions.filter(t => (isE ? t.employerId : t.workerId) === me.id).sort((a, b) => b.createdAt - a.createdAt);
  const pending = DB.jobs.filter(j => (isE ? j.employerId : j.workerId) === me.id && j.status === 'Worker Selected');

/* ---------- Router ---------- */
const ROUTES = { '': V.home, jobs: V.jobs, job: V.job, workers: V.workers, profile: V.profile, post: V.post, dashboard: V.dashboard, payments: V.payments, settings: V.settings, login: V.login, signup: V.signup, verify: V.verify, forgot: V.forgot, reset: V.reset, roadmap: V.roadmap };
const AUTH = new Set(['post', 'dashboard', 'payments', 'settings']);
let lastKey = null;

function parseRoute() {
  const h = (window.location.hash || '#/').slice(1);
  const parts = h.split('?');
  return { path: parts[0].split('/').filter(Boolean), query: Object.fromEntries(new URLSearchParams(parts[1] || '')) };
}
function go(hash) { if (window.location.hash === hash) render(); else window.location.hash = hash; }

function render(keepScroll) {
  route = parseRoute();
  const key = route.path[0] || '', me = Q.me();
  if (AUTH.has(key) && !me) { toast('Sign in to continue.', 'error'); window.location.hash = '#/login'; return; }
  if (key === 'post' && me.role !== 'employer') { toast('Only employers can post jobs.', 'error'); window.location.hash = '#/dashboard'; return; }
  if ((key === 'jobs' || key === 'workers') && Object.keys(route.query).length) {
    Object.assign(FIL[key], route.query);
    window.history.replaceState(null, '', '#/' + key);
    route.query = {};
  }
  let html;
  try { html = (ROUTES[key] || V.notFound)(...route.path.slice(1)); }
  catch (err) { console.error(err); html = `<div class="page">${empty('Something went wrong', 'Try going back to the home page.', '<a class="btn btn-primary" href="#/">Home</a>')}</div>`; }
  const y = window.scrollY;
  $('#app').innerHTML = header() + `<main id="main" class="container">${html}</main>` + footer() + demoBar();
  const sig = route.path.join('/');
  if (keepScroll && sig === lastKey) window.scrollTo(0, y); else window.scrollTo(0, 0);
  lastKey = sig; ui.menu = false;
}

  const f = $('#modalRoot input:not([type=hidden]), #modalRoot textarea, #modalRoot .btn-primary, #modalRoot .btn-accent');
  if (f) f.focus();
}
const closeModal = () => { $('#modalRoot').innerHTML = ''; };
function toast(msg, kind) {
  const el = document.createElement('div'); el.className = 'toast ' + (kind || ''); el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3600);
}
function done(res, msg) {
  if (!res.ok) { toast(res.error, 'error'); return false; }
  if (msg) toast(msg); closeModal(); render(true); return true;
}

/* ---------- Image helper ---------- */
function compress(file, max) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

}
document.addEventListener('input', onFilter);
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.change === 'demoUser') {
    DB.session.userId = t.value || null; save();
    if (t.value) toast('Now viewing as ' + Q.user(t.value).name + '.');
    const k = route.path[0]; if (k === 'post' && Q.me() && Q.me().role !== 'employer') go('#/dashboard'); else if (!t.value && AUTH.has(k)) go('#/'); else render(true);
  }
  if (t.id === 'bidPhotos' && t.files) {
    for (const file of [...t.files]) { if (ui.photos.length >= 4) { toast('You can attach up to 4 photos.', 'error'); break; } try { ui.photos.push(await compress(file, 640)); } catch (err) { toast('That image could not be read.', 'error'); } }
    $('#photoThumbs').innerHTML = thumbsHtml(); t.value = '';
  }
  if (t.id === 'avatarInput' && t.files && t.files[0]) {
    try { ui.avatar = await compress(t.files[0], 240); $('#avPrev').innerHTML = `<img class="avatar" src="${ui.avatar}" alt="Preview" width="72" height="72" style="width:72px;height:72px">`; } catch (err) { toast('That image could not be read.', 'error'); }
  }
});
window.addEventListener('hashchange', () => render(false));

/* ---------- Boot ---------- */
DB = load();
window.Nearhand = { S, Q, V, render, get DB() { return DB; }, FIL, A, F };
render(false);
})();
</script>
</body>
</html>
